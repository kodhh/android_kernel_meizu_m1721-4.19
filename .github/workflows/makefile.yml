name: Build Yureka2 Kernel with Clang

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    # 根据项目需求选择 windows-latest 或 ubuntu-latest
    runs-on: ubuntu-latest  # 若在Windows上编译，通常需改为 windows-latest
    env:
      CLANG_PATH: /home/runner/prebuilt/clang

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Clone GCC Toolchains
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

        # 使用 home 目录避免权限问题
        mkdir -p $CLANG_PATH

        git clone --depth=1 --single-branch -b android14-release \
          https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
          $CLANG_PATH || { echo "CLANG clone failed"; exit 1; }

    - name: Configure Kernel (示例)
      run: |
        # 此处为示例配置命令，请替换为你的WSL2内核实际配置命令
        # 例如：make ARCH=arm64 CC=clang defconfig
        export PATH="$CLANG_PATH/clang-r475365b/bin:$PATH"
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CC=clang LD=ld.lld vendor/YUREKA2_lto_defconfig O=out

    - name: Build Kernel with Clang
      run: |
        # 此处为示例编译命令，请替换为你的WSL2内核实际编译命令
        # 例如：make ARCH=arm64 CC=clang -j$(nproc)
        export PATH="$CLANG_PATH/clang-r475365b/bin:$PATH"
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CC=clang LD=ld.lld KSU_VERSION=$(cd KernelSU && expr $(/usr/bin/git rev-list --count HEAD) + 13000) O=out -j$(nproc)

    # 可选：上传构建产物
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: out/arch/arm64/boot/Image.gz-dtb
