name: Build Yureka2 Kernel with Clang

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    # 根据项目需求选择 windows-latest 或 ubuntu-latest
    runs-on: ubuntu-latest  # 若在Windows上编译，通常需改为 windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install LLVM 18 and Dependencies
      run: |
        # 添加 LLVM 官方源
        wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
        sudo add-apt-repository "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main"
        
        # 更新并安装 LLVM 18 及依赖
        sudo apt-get update
        sudo apt-get install -y \
          clang-18 \
          lld-18 \
          llvm-18 \
          gcc-aarch64-linux-gnu \
          gcc-arm-linux-gnueabi \
          build-essential \
          flex \
          bison \
          libssl-dev \
          bc

        # 设置默认版本
        sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
        sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
        sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-18 100
        sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100
        
        # 创建所有必要的符号链接
        sudo ln -sf /usr/bin/clang-18 /usr/bin/clang
        sudo ln -sf /usr/bin/clang++-18 /usr/bin/clang++
        sudo ln -sf /usr/bin/lld-18 /usr/bin/lld
        sudo ln -sf /usr/bin/ld.lld-18 /usr/bin/ld.lld
        sudo ln -sf /usr/bin/llvm-nm-18 /usr/bin/llvm-nm
        sudo ln -sf /usr/bin/llvm-ar-18 /usr/bin/llvm-ar
        sudo ln -sf /usr/bin/llvm-objcopy-18 /usr/bin/llvm-objcopy
        sudo ln -sf /usr/bin/llvm-objdump-18 /usr/bin/llvm-objdump
        sudo ln -sf /usr/bin/llvm-readelf-18 /usr/bin/llvm-readelf
        sudo ln -sf /usr/bin/llvm-strip-18 /usr/bin/llvm-strip
    
        # 验证所有工具
        which llvm-nm
        which llvm-ar
        which clang
        which ld.lld

    - name: Configure Kernel (示例)
      run: |
        # 此处为示例配置命令，请替换为你的WSL2内核实际配置命令
        # 例如：make ARCH=arm64 CC=clang defconfig
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CC=clang LD=ld.lld vendor/YUREKA2_lto_defconfig O=out

    - name: Build Kernel with Clang
      run: |
        # 此处为示例编译命令，请替换为你的WSL2内核实际编译命令
        # 例如：make ARCH=arm64 CC=clang -j$(nproc)
        make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CC=clang LD=ld.lld KSU_VERSION=$(cd KernelSU && expr $(/usr/bin/git rev-list --count HEAD) + 13000) O=out -j$(nproc)

    # 可选：上传构建产物
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: out/arch/arm64/boot/Image.gz-dtb
